    <script>
    window.PVStatsReady = (async function() {
      var API = 'https://js.ruseo.cn/api/counter.php';
      var KEY = 'e91d240cb9d6f59608ce9db2fded6e79';
      var C_TOTAL = '32213d0aaffbc0c523dce9c372ad9a63';
      var C_MONTH = '7a5000d0757ff5e1d649df7433d082ba';
      var C_DAY = '618c85d0ef884185d67e6caba50d1f65';
      var C_YDAY = 'c9b394fa8ed7a2698d85b9096751db17';
      function pad(n) { return String(n).padStart(2, '0'); }
      function bjDate(offsetDays) {
        var d = new Date(Date.now() + (480 + new Date().getTimezoneOffset()) * 60000 + (offsetDays || 0) * 86400000);
        return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
      }
      function api(params) {
        var qs = Object.keys(params).map(function(k) { return k + '=' + encodeURIComponent(params[k]); }).join('&');
        return fetch(API + '?' + qs, { cache: 'no-store' }).then(function(r) { return r.json(); });
      }
      var today = bjDate(0), yesterday = bjDate(-1), thisMonth = today.slice(0, 7);
      var dayInfo = await api({ action: 'get', api_key: KEY, counter_id: C_DAY });
      var dayLast = (dayInfo.counter && dayInfo.counter.last_count_time) || '';
      if (dayLast.slice(0, 10) !== today) {
        await api({ action: 'reset', api_key: KEY, counter_id: C_YDAY });
        if (dayLast.slice(0, 10) === yesterday) {
          var oldCount = parseInt(dayInfo.counter && dayInfo.counter.current_count, 10) || 0;
          if (oldCount > 0) await api({ action: 'increment', api_key: KEY, counter_id: C_YDAY, value: oldCount });
        }
        await api({ action: 'reset', api_key: KEY, counter_id: C_DAY });
      }
      var monInfo = await api({ action: 'get', api_key: KEY, counter_id: C_MONTH });
      var monLast = (monInfo.counter && monInfo.counter.last_count_time) || '';
      if (monLast.slice(0, 7) !== thisMonth) await api({ action: 'reset', api_key: KEY, counter_id: C_MONTH });
      await Promise.all([
        api({ action: 'increment', api_key: KEY, counter_id: C_TOTAL, value: 1 }),
        api({ action: 'increment', api_key: KEY, counter_id: C_MONTH, value: 1 }),
        api({ action: 'increment', api_key: KEY, counter_id: C_DAY, value: 1 })
      ]);
      var final = await Promise.all([
        api({ action: 'get', api_key: KEY, counter_id: C_TOTAL }),
        api({ action: 'get', api_key: KEY, counter_id: C_MONTH }),
        api({ action: 'get', api_key: KEY, counter_id: C_DAY }),
        api({ action: 'get', api_key: KEY, counter_id: C_YDAY })
      ]);
      function cnt(r) { return parseInt(r && r.counter && r.counter.current_count, 10) || 0; }
      return { total: cnt(final[0]), month: cnt(final[1]), today: cnt(final[2]), yesterday: cnt(final[3]) };
    })().catch(function(err) { console.warn('PV counter error:', err); return null; });
    </script>
