<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隐私政策 — DevBlog</title>
    <meta name="author" content="DevBlog">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="icon.jpeg">
    <link rel="stylesheet" href="userlogin.css">
    <link rel="stylesheet" href="gate.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { overflow-y: auto; align-items: flex-start; padding: 40px 20px; }
        .privacy-wrap {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 820px;
            margin: 0 auto;
        }
        .privacy-card {
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            border: 1px solid var(--glass-border);
            border-radius: var(--r-xl);
            box-shadow: var(--shadow-lg);
            padding: 48px 52px;
        }
        [data-theme="dark"] .privacy-card {
            background: rgba(17, 24, 39, 0.6);
            border-color: rgba(148, 163, 184, 0.15);
        }
        .privacy-header {
            text-align: center;
            margin-bottom: 36px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-1);
        }
        .privacy-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-1);
            margin-bottom: 8px;
        }
        .privacy-header p {
            font-size: 0.85rem;
            color: var(--text-3);
        }
        .privacy-body h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-1);
            margin: 28px 0 14px;
            padding-left: 14px;
            border-left: 3px solid var(--brand-500);
        }
        .privacy-body p {
            font-size: 0.9rem;
            color: var(--text-2);
            line-height: 1.8;
            margin-bottom: 12px;
        }
        .privacy-body strong {
            color: var(--text-1);
            font-weight: 600;
        }
        .privacy-body ul {
            list-style: none;
            padding-left: 0;
            margin-bottom: 14px;
        }
        .privacy-body ul li {
            font-size: 0.88rem;
            color: var(--text-2);
            line-height: 1.8;
            padding-left: 18px;
            position: relative;
        }
        .privacy-body ul li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--brand-500);
            font-weight: 700;
        }
        .privacy-table-wrap {
            overflow-x: auto;
            margin: 16px 0 20px;
            border-radius: var(--r-md);
            border: 1px solid var(--border-1);
        }
        .privacy-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
        }
        .privacy-table th,
        .privacy-table td {
            padding: 10px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border-1);
            color: var(--text-2);
            vertical-align: top;
        }
        .privacy-table th {
            background: var(--bg-muted);
            font-weight: 600;
            color: var(--text-1);
            white-space: nowrap;
        }
        .privacy-table tr:last-child td {
            border-bottom: none;
        }
        .privacy-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 36px;
            padding: 10px 24px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #fff;
            background: linear-gradient(135deg, var(--brand-500), var(--accent-500));
            border-radius: var(--r-full);
            transition: all var(--t-base);
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.25);
        }
        .privacy-back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
            color: #fff;
        }
        @media (max-width: 640px) {
            .privacy-card { padding: 32px 24px; }
            .privacy-header h1 { font-size: 1.3rem; }
            .privacy-body h2 { font-size: 1rem; }
            .privacy-body p { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <!-- 邀请码门控 -->
    <div id="invite-gate">
        <div class="gate-card">
            <div class="gate-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            </div>
            <h2 class="gate-title">请输入邀请码</h2>
            <p class="gate-subtitle">本站需凭邀请码访问<br>请输入有效邀请码以继续</p>
            <div class="gate-input-wrap">
                <input type="text" class="gate-input" placeholder="请输入邀请码" autocomplete="off">
            </div>
            <button class="gate-btn">进入</button>
            <div class="gate-msg"></div>
        </div>
    </div>

    <!-- 动态背景 -->
    <div class="bg-animation">
        <div class="bg-shape shape-1"></div>
        <div class="bg-shape shape-2"></div>
        <div class="bg-shape shape-3"></div>
    </div>

    <!-- 返回博客 -->
    <a href="blog.html" class="back-link">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        返回
    </a>

    <!-- 主题切换 -->
    <button class="theme-toggle-login" id="themeToggle" aria-label="切换主题" title="切换主题">
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18">
            <circle cx="12" cy="12" r="5" fill="currentColor"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18">
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" fill="currentColor"/>
        </svg>
    </button>

            <a href="login.html" class="privacy-back-btn">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                返回
            </a>
        </div>
    </div>

    <script src="userlogin.js"></script>
    <script src="gate.js"></script>
</body>
</html>
