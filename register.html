<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 — DevBlog</title>
    <meta name="author" content="DevBlog">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="icon.jpeg">
    <link rel="stylesheet" href="userlogin.css">
    <link rel="stylesheet" href="gate.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 邀请码门控 -->
    <div id="invite-gate">
        <div class="gate-card">
            <div class="gate-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            </div>
            <h2 class="gate-title">请输入邀请码</h2>
            <p class="gate-subtitle">本站需凭邀请码访问<br>请输入有效邀请码以继续</p>
            <div class="gate-input-wrap">
                <input type="text" class="gate-input" placeholder="请输入邀请码" autocomplete="off">
            </div>
            <button class="gate-btn">进入</button>
            <div class="gate-msg"></div>
        </div>
    </div>

    <!-- 动态背景 -->
    <div class="bg-animation">
        <div class="bg-shape shape-1"></div>
        <div class="bg-shape shape-2"></div>
        <div class="bg-shape shape-3"></div>
    </div>

    <!-- 返回博客 -->
    <a href="blog.html" class="back-link">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        返回博客
    </a>

    <!-- 主题切换 -->
    <button class="theme-toggle-login" id="themeToggle" aria-label="切换主题" title="切换主题">
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18">
            <circle cx="12" cy="12" r="5" fill="currentColor"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18">
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" fill="currentColor"/>
        </svg>
    </button>

    <!-- 注册卡片 -->
    <div class="auth-wrap">
        <div class="auth-card glass">
            <!-- 品牌区 -->
            <div class="auth-brand">
                <img src="blog-icon.jpg" alt="DevBlog" class="auth-brand-logo">
                <div class="auth-brand-name">DevBlog</div>
                <div class="auth-brand-sub">创建账户，开启你的创作之旅</div>
            </div>

            <!-- 表单 -->
            <form id="registerForm">
                <h2 class="auth-title">创建账户</h2>
                <p class="auth-subtitle">填写以下信息完成注册</p>

                <div class="form-message" id="registerMessage"></div>

                <div class="form-group">
                    <label class="form-label" for="username">用户名</label>
                    <div class="form-input-wrap">
                        <input type="text" id="username" name="username" class="form-input" placeholder="3-20 位字母、数字、下划线或中文" autocomplete="username" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">密码</label>
                    <div class="form-input-wrap">
                        <input type="password" id="password" name="password" class="form-input" placeholder="至少 6 位" autocomplete="new-password" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">确认密码</label>
                    <div class="form-input-wrap">
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" placeholder="再次输入密码" autocomplete="new-password" required>
                    </div>
                </div>

                <div class="form-row">
                    <label class="form-check">
                        <input type="checkbox" id="remember" name="remember">
                        <span>保持登录</span>
                    </label>
                </div>

                <div class="privacy-agree">
                    <label class="form-check">
                        <input type="checkbox" id="privacyAgree" name="privacyAgree">
                        <span>我已阅读并同意<a href="privacy.html" onclick="window.open('privacy.html','privacyWindow','width=900,height=700,scrollbars=yes,resizable=yes'); return false;" class="privacy-link">《隐私政策》</a></span>
                    </label>
                </div>

                <button type="submit" class="btn-submit">
                    注册
                </button>

                <div class="auth-footer">
                    已有账户？<a href="login.html">立即登录</a>
                </div>
            </form>
        </div>
    </div>

    <script src="userlogin.js"></script>
    <script src="gate.js"></script>
</body>
</html>
