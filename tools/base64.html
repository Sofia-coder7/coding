<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script>(function(){var s=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'));})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 加密/解密 — 寒枝可栖</title>
    <meta name="author" content="寒枝可栖">
    <link rel="icon" href="../home-icon.jpeg">
    <link rel="stylesheet" href="../style/home.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"></noscript>
</head>
<body>
    <div id="loadingBarMount"></div>
    <div id="sidebarMount"></div>

    <div class="pages">
        <section class="page active">
            <div class="try-wrap">
                <div class="try-main">
                    <div class="try-panel active" id="panel-base64">
                        <div class="try-toolbar">
                            <span class="try-url">Base64 加密 / 解密</span>
                            <div class="py-actions">
                                <button class="md-btn" id="b64Clear" title="清空">
                                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
                                    清空
                                </button>
                                <button class="md-btn" id="b64Swap" title="交换输入输出">
                                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16V4M7 4L3 8M7 4l4 4M17 8v12M17 20l4-4M17 20l-4-4"/></svg>
                                    交换
                                </button>
                                <button class="md-btn" id="b64Copy" title="复制结果">
                                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                                    复制
                                </button>
                                <button class="try-run" id="b64Encode">
                                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
                                    编码
                                </button>
                                <button class="try-run" id="b64Decode">
                                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 19l-7-7 7-7"/></svg>
                                    解码
                                </button>
                            </div>
                        </div>
                        <div class="md-wrap">
                            <div class="md-editor-area">
                                <div class="md-editor-header">输入</div>
                                <textarea id="b64Input" spellcheck="false" placeholder="输入要编码或解码的文本" style="flex:1;width:100%;padding:16px;font-family:'JetBrains Mono',monospace;font-size:14px;background:var(--bg-input);color:var(--t1);border:none;resize:none;outline:none;">Hello, World!</textarea>
                            </div>
                            <div class="md-preview-area">
                                <div class="md-preview-header">输出</div>
                                <textarea id="b64Output" spellcheck="false" placeholder="结果将显示在这里" readonly style="flex:1;width:100%;padding:16px;font-family:'JetBrains Mono',monospace;font-size:14px;background:var(--bg-input);color:var(--t1);border:none;resize:none;outline:none;"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <div id="footerMount"></div>
    <div id="modalsMount"></div>

    <script src="../script/changelog.js"></script>
    <script src="../script/sidebar.js"></script>
    <script src="../script/setting.js"></script>
    <script src="../script/contextmenu.js"></script>
    <script src="../script/outer.js"></script>
    <script src="tool.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof initBase64 === 'function') initBase64();
        });
    </script>
</body>
</html>
