<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script>(function(){var s=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'));})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 格式化/压缩 — 寒枝可栖</title>
    <meta name="author" content="寒枝可栖">
    <link rel="icon" href="../home-icon.jpeg">
    <link rel="stylesheet" href="../style/home.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"></noscript>
</head>
<body>
    <div id="loadingBarMount"></div>
    <div id="sidebarMount"></div>

    <div class="pages">
        <section class="page active">
            <div class="try-wrap">
                <div class="try-main">
                    <div class="try-panel active" id="panel-css-fmt">
                        <div class="try-toolbar">
                            <span class="try-url">CSS 格式化 / 压缩</span>
                            <div class="py-actions">
                                <button class="md-btn" id="cssFmtClear" title="清空">
                                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
                                    清空
                                </button>
                                <button class="md-btn" id="cssFmtCopy" title="复制结果">
                                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                                    复制
                                </button>
                                <button class="try-run" id="cssFmtFormat">
                                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h10M4 17h16"/></svg>
                                    格式化
                                </button>
                                <button class="try-run" id="cssFmtCompress">
                                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 3v5M21 3h-5M3 21v-5M3 21h5M3 3l18 18"/></svg>
                                    压缩
                                </button>
                            </div>
                        </div>
                        <div class="md-wrap">
                            <div class="md-editor-area">
                                <div class="md-editor-header">输入 CSS</div>
                                <div class="code-editor-wrap">
                                    <pre class="code-highlight" id="cssFmtHighlight" aria-hidden="true"><code class="language-css"></code></pre>
                                    <textarea id="cssFmtCode" spellcheck="false" placeholder="在此粘贴需要格式化或压缩的 CSS 代码">body{margin:0;padding:0;font-family:sans-serif}.container{max-width:1200px;margin:0 auto;padding:20px}.btn{display:inline-block;padding:10px 20px;border-radius:6px;background:#3b82f6;color:#fff;cursor:pointer;transition:all .2s}.btn:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.15)}</textarea>
                                </div>
                            </div>
                            <div class="md-preview-area">
                                <div class="md-preview-header">输出结果</div>
                                <div class="code-editor-wrap" style="height:auto;">
                                    <pre class="code-highlight" id="cssFmtOutputHighlight" aria-hidden="true"><code class="language-css"></code></pre>
                                    <textarea id="cssFmtOutput" spellcheck="false" placeholder="格式化/压缩结果将显示在这里" readonly></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <div id="footerMount"></div>
    <div id="modalsMount"></div>

    <script defer src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-core.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-css.min.js"></script>
    <script defer src="../script/changelog.js"></script>
    <script defer src="../script/sidebar.js"></script>
    <script defer src="../script/setting.js"></script>
    <script defer src="../script/contextmenu.js"></script>
    <script defer src="../script/outer.js"></script>
    <script defer src="tool.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof initCssFormatter === 'function') initCssFormatter();
        });
    </script>
</body>
</html>
