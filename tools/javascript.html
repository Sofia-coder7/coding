<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript 在线预览 — 寒枝可栖</title>
    <meta name="author" content="寒枝可栖">
    <link rel="icon" href="../home-icon.jpeg">
    <link rel="stylesheet" href="../style/home.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="loadingBarMount"></div>
    <div id="sidebarMount"></div>

    <div class="pages">
        <section class="page active">
            <div class="try-wrap">
                <div class="try-main">
                    <div class="try-panel active" id="panel-javascript">
                        <div class="try-toolbar">
                            <span class="try-url">JavaScript 在线预览</span>
                            <div class="md-actions">
                                <input type="file" id="jsImportFile" accept=".js,.txt" style="display:none">
                                <button class="md-btn" id="jsImport" title="导入 .js 文件">
                                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                                    导入
                                </button>
                                <button class="md-btn" id="jsDownload" title="下载">
                                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                                    下载
                                </button>
                                <button class="try-run" id="jsRefresh">
                                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
                                    刷新预览
                                </button>
                            </div>
                        </div>
                        <div class="md-wrap">
                            <div class="md-editor-area">
                                <div class="md-editor-header">JavaScript 代码</div>
                                <div class="code-editor-wrap">
                                    <pre class="code-highlight" id="jsHighlight" aria-hidden="true"><code class="language-javascript"></code></pre>
                                    <textarea id="jsCode" spellcheck="false" placeholder="在此输入 JavaScript 代码">// 点击"刷新预览"在 iframe 中运行
document.body.innerHTML = `
  <div style="font-family:sans-serif;padding:30px;">
    <h2 style="color:#0ea5e9;">JavaScript 预览</h2>
    <p>当前时间：<span id="clock"></span></p>
    <button id="btn" style="padding:8px 16px;background:#0ea5e9;color:white;border:none;border-radius:6px;cursor:pointer;">
      点我计数
    </button>
    <p>点击次数：<span id="count">0</span></p>
  </div>
`;

let count = 0;
document.getElementById('btn').addEventListener('click', () => {
  count++;
  document.getElementById('count').textContent = count;
});

function updateClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString();
}
updateClock();
setInterval(updateClock, 1000);</textarea>
                                </div>
                            </div>
                            <div class="md-preview-area">
                                <div class="md-preview-header">预览</div>
                                <iframe id="jsPreview" class="web-preview" sandbox="allow-scripts allow-forms allow-popups allow-modals"></iframe>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <div id="footerMount"></div>
    <div id="modalsMount"></div>

    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script>
    <script src="../script/changelog.js"></script>
    <script src="../script/common.js"></script>
    <script src="tool.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof initJsPreview === 'function') initJsPreview();
        });
    </script>
</body>
</html>
